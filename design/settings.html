<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f7">
  <title>HSP Watch · 更多</title>
  <link rel="icon" href="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png">
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/app.js"></script>
</head>
<body data-page="settings">
  <div class="prototype-stage">
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="system-bar">
          <time data-current-time>09:41</time>
          <div class="system-icons" aria-hidden="true"><span class="icon" data-icon="wifi"></span><span class="icon" data-icon="battery-charging"></span></div>
        </div>
        <header class="app-bar">
          <a class="app-brand" href="index.html"><img src="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png" alt=""><span>HSP Watch</span></a>
          <span class="connection-chip"><span class="status-dot" data-connection-dot></span><span data-connected-copy>手表已连接</span></span>
        </header>

        <main class="phone-content">
          <div class="page-head"><h1>更多</h1><p>系统权限与连接诊断。</p></div>

          <section class="section" style="margin-top: 0">
            <div class="section-head"><h2>系统状态</h2><span>运行正常</span></div>
            <div class="settings-list">
              <div class="setting-row"><span class="row-icon green"><span class="icon" data-icon="bluetooth"></span></span><span class="row-copy"><strong>手机蓝牙</strong><span>用于扫描和连接手表</span></span><span class="row-state good" data-bluetooth-state>已开启</span></div>
              <div class="setting-row"><span class="row-icon green"><span class="icon" data-icon="shield-check"></span></span><span class="row-copy"><strong>所需权限</strong><span>蓝牙、位置与通知权限</span></span><span class="row-state good" data-permission-state>已允许</span></div>
              <div class="setting-row"><span class="row-icon"><span class="icon" data-icon="database"></span></span><span class="row-copy"><strong>本地数据</strong><span>BLE 地址和最多 5 条消息</span></span><span class="row-state">设备内</span></div>
            </div>
          </section>

          <section class="section">
            <details class="diagnostics">
              <summary><span class="icon" data-icon="bug"></span><span>BLE 诊断</span><span class="icon chevron" data-icon="chevron-right"></span></summary>
              <div class="diagnostic-content">
                <div class="diagnostic-row"><span>前台服务</span><span class="good-text" data-service-state>运行中</span></div>
                <div class="diagnostic-row"><span>GATT 连接</span><span class="good-text" data-connection-value>已连接</span></div>
                <div class="diagnostic-row"><span>状态通道</span><span class="good-text" data-status-channel>已订阅</span></div>
                <div class="diagnostic-row"><span>同步通道</span><span class="good-text" data-sync-channel>已就绪</span></div>
                <div class="diagnostic-row"><span>BLE 地址</span><span>D8:3A:DD:7B:21:06</span></div>
              </div>
            </details>
          </section>

          <section class="section"><button class="btn btn-secondary btn-block" type="button" data-action="grant-permissions"><span class="icon" data-icon="shield-check"></span><span>检查所需权限</span></button></section>
        </main>

        <div data-bottom-nav></div>
        <div class="toast" role="status" aria-live="polite" data-toast></div>
      </div>
    </div>
  </div>
</body>
</html>
