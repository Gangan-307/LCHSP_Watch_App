<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f7">
  <title>HSP Watch · 通知</title>
  <link rel="icon" href="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png">
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/app.js"></script>
</head>
<body data-page="notifications">
  <div class="prototype-stage">
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="system-bar">
          <time data-current-time>09:41</time>
          <div class="system-icons" aria-hidden="true"><span class="icon" data-icon="wifi"></span><span class="icon" data-icon="battery-charging"></span></div>
        </div>
        <header class="app-bar">
          <a class="app-brand" href="index.html"><img src="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png" alt=""><span>HSP Watch</span></a>
          <span class="connection-chip"><span class="status-dot" data-connection-dot></span><span data-connected-copy>手表已连接</span></span>
        </header>

        <main class="phone-content">
          <div class="page-head"><h1>消息通知</h1><p>新消息会自动发送到手表。</p></div>

          <article class="plain-card surface">
            <div class="service-control">
              <div class="service-control-copy"><strong>通知读取</strong><span>短信、微信和 QQ / TIM</span></div>
              <span class="badge good" data-notification-badge data-notification-access>已开启</span>
            </div>
            <button class="btn btn-secondary btn-block" type="button" data-action="manage-notifications"><span class="icon" data-icon="settings-2"></span><span data-notification-action-label>管理通知读取</span></button>
          </article>

          <section class="section">
            <div class="section-head"><h2>支持来源</h2><span>3 个应用</span></div>
            <div class="source-chip-row" aria-label="支持的通知来源"><span class="source-chip"><span class="source-mark sms">短</span>短信</span><span class="source-chip"><span class="source-mark wechat">微</span>微信</span><span class="source-chip"><span class="source-mark qq">Q</span>QQ / TIM</span></div>
          </section>

          <section class="section">
            <div class="section-head"><h2>最近缓存</h2><span>最多 5 条</span></div>
            <div class="message-list">
              <article class="message-item surface"><span class="message-app source-mark wechat">微</span><div class="message-copy"><strong>产品讨论群</strong><span>09:36</span><p>新的固件版本已经可以开始联调。</p></div><span class="badge blue">已缓存</span></article>
              <article class="message-item surface"><span class="message-app source-mark sms">短</span><div class="message-copy"><strong>验证码</strong><span>09:18</span><p>您的登录验证码为 4826，请勿转发。</p></div><span class="badge blue">已缓存</span></article>
              <article class="message-item surface"><span class="message-app source-mark qq">Q</span><div class="message-copy"><strong>设备联调</strong><span>08:54</span><p>日志已经上传，请确认断线重连结果。</p></div><span class="badge blue">已缓存</span></article>
            </div>
          </section>
        </main>

        <div data-bottom-nav></div>
        <div class="toast" role="status" aria-live="polite" data-toast></div>
      </div>
    </div>
  </div>
</body>
</html>
