<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f7">
  <title>HSP Watch · 首页</title>
  <link rel="icon" href="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png">
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/app.js"></script>
</head>
<body data-page="home">
  <div class="prototype-stage">
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="system-bar">
          <time data-current-time>09:41</time>
          <div class="system-icons" aria-hidden="true"><span class="icon" data-icon="wifi"></span><span class="icon" data-icon="battery-charging"></span></div>
        </div>
        <header class="app-bar">
          <a class="app-brand" href="index.html"><img src="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png" alt=""><span>HSP Watch</span></a>
          <span class="connection-chip"><span class="status-dot" data-connection-dot></span><span data-connected-copy>手表已连接</span></span>
        </header>

        <main class="phone-content">
          <div class="page-head"><h1>今日概览</h1><p>你的 HSP Watch 已准备就绪。</p></div>

          <article class="device-card surface">
            <div class="device-visual"><img src="../docs/icon.png" alt="HSP Watch"></div>
            <div class="device-info">
              <span class="eyebrow">已连接设备</span>
              <div class="device-title-row"><h2>HSP Watch</h2><span class="battery"><span class="icon icon-sm" data-icon="battery-charging"></span>82%</span></div>
              <p class="device-subtext">未充电 · 固件 0.1.0</p>
              <p class="device-detail-line">状态更新于 <span data-sync-age>刚刚</span></p>
              <button class="btn btn-primary device-action" type="button" data-action="find-watch"><span class="icon" data-icon="locate-fixed"></span><span data-find-label>查找手表</span></button>
            </div>
          </article>

          <section class="section">
            <div class="section-head"><h2>今日活动</h2><span>来自手表</span></div>
            <div class="metric-grid">
              <div class="metric"><strong>6,842</strong><span>步数</span></div>
              <div class="metric"><strong>286</strong><span>kcal</span></div>
              <div class="metric"><strong>4.8 km</strong><span>距离</span></div>
            </div>
          </section>
        </main>

        <div data-bottom-nav></div>
        <div class="toast" role="status" aria-live="polite" data-toast></div>
      </div>
    </div>
  </div>
</body>
</html>
