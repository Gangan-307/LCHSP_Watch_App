<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f7">
  <title>HSP Watch · 同步</title>
  <link rel="icon" href="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png">
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/app.js"></script>
</head>
<body data-page="sync">
  <div class="prototype-stage">
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="system-bar">
          <time data-current-time>09:41</time>
          <div class="system-icons" aria-hidden="true"><span class="icon" data-icon="wifi"></span><span class="icon" data-icon="battery-charging"></span></div>
        </div>
        <header class="app-bar">
          <a class="app-brand" href="index.html"><img src="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png" alt=""><span>HSP Watch</span></a>
          <span class="connection-chip"><span class="status-dot" data-connection-dot></span><span data-connected-copy>手表已连接</span></span>
        </header>

        <main class="phone-content">
          <div class="page-head"><h1>数据同步</h1><p>将手机信息发送到手表。</p></div>

          <article class="sync-summary surface">
            <div class="sync-summary-head">
              <span class="sync-symbol"><span class="icon" data-icon="refresh-cw"></span></span>
              <div><h2 data-sync-result>同步已就绪</h2><p>最近同步 <span data-sync-age>刚刚</span></p></div>
            </div>
            <button class="btn btn-primary btn-block" type="button" data-action="sync-now"><span class="icon" data-icon="refresh-cw"></span><span data-sync-label>立即同步</span></button>
            <div class="sync-progress" data-sync-progress><span></span></div>
          </article>

          <section class="section">
            <div class="section-head"><h2>本次内容</h2><span>自动更新</span></div>
            <div class="key-list">
              <div class="key-row"><span class="row-icon blue"><span class="icon" data-icon="clock"></span></span><span class="row-copy"><strong>时间与时区</strong><span>连接后自动同步</span></span><span class="row-state good">已同步</span></div>
              <div class="key-row"><span class="row-icon blue"><span class="icon" data-icon="map-pin"></span></span><span class="row-copy"><strong>位置与城市</strong><span>单次定位，不持续跟踪</span></span><span class="row-state" data-permission-state>已允许</span></div>
              <div class="key-row"><span class="row-icon amber"><span class="icon" data-icon="cloud-sun"></span></span><span class="row-copy"><strong>天气</strong><span>当前天气与当日高低温</span></span><span class="row-state good">可用</span></div>
              <div class="key-row"><span class="row-icon"><span class="icon" data-icon="music-2"></span></span><span class="row-copy"><strong>歌词与封面</strong><span>播放时自动更新</span></span><span class="row-state">等待播放</span></div>
            </div>
          </section>
        </main>

        <div data-bottom-nav></div>
        <div class="toast" role="status" aria-live="polite" data-toast></div>
      </div>
    </div>
  </div>
</body>
</html>
