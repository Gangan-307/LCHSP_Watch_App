<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f7">
  <title>HSP Watch · 设备</title>
  <link rel="icon" href="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png">
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/app.js"></script>
</head>
<body data-page="device">
  <div class="prototype-stage">
    <div class="phone-frame">
      <div class="phone-screen">
        <div class="system-bar">
          <time data-current-time>09:41</time>
          <div class="system-icons" aria-hidden="true"><span class="icon" data-icon="wifi"></span><span class="icon" data-icon="battery-charging"></span></div>
        </div>
        <header class="app-bar">
          <a class="app-brand" href="index.html"><img src="../app/src/main/res/mipmap-xxxhdpi/ic_launcher_watch.png" alt=""><span>HSP Watch</span></a>
          <span class="connection-chip"><span class="status-dot" data-connection-dot></span><span data-connected-copy>手表已连接</span></span>
        </header>

        <main class="phone-content">
          <div class="page-head"><h1>设备</h1><p>连接与硬件信息。</p></div>

          <article class="plain-card surface">
            <div class="service-control">
              <div class="service-control-copy"><strong>后台连接服务</strong><span>自动直连与断线重连</span></div>
              <label class="switch" aria-label="后台连接服务"><input type="checkbox" checked data-service-toggle><span class="switch-track"></span></label>
            </div>
          </article>

          <section class="section">
            <div class="section-head"><h2>设备信息</h2><span class="badge good" data-connection-value>已连接</span></div>
            <div class="key-list">
              <div class="key-row"><span class="row-icon"><span class="icon" data-icon="watch"></span></span><span class="row-copy"><strong>HSP Watch</strong><span>固件版本 0.1.0</span></span><span class="row-state good">82% · 未充电</span></div>
              <div class="key-row"><span class="row-icon blue"><span class="icon" data-icon="bluetooth"></span></span><span class="row-copy"><strong>BLE 地址</strong><span>D8:3A:DD:7B:21:06</span></span><span class="row-state" data-service-state>运行中</span></div>
            </div>
          </section>

          <section class="section">
            <div class="section-head"><h2>连接通道</h2><span>已初始化</span></div>
            <div class="key-list">
              <div class="key-row"><span class="row-icon green"><span class="icon" data-icon="radio"></span></span><span class="row-copy"><strong>设备状态</strong><span>电量、充电与运动数据</span></span><span class="row-state good" data-status-channel>已订阅</span></div>
              <div class="key-row"><span class="row-icon blue"><span class="icon" data-icon="refresh-cw"></span></span><span class="row-copy"><strong>数据同步</strong><span>手机数据与通知写入</span></span><span class="row-state blue" data-sync-channel>已就绪</span></div>
            </div>
          </section>
        </main>

        <div data-bottom-nav></div>
        <div class="toast" role="status" aria-live="polite" data-toast></div>
      </div>
    </div>
  </div>
</body>
</html>
